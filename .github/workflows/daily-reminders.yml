name: Daily practice reminders

# Wakes the API and sends any due push reminders. The server also checks every
# 10 minutes while awake; each student's day is claimed once, so runs never double-send.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder run
        env:
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
          API_URL: ${{ vars.API_URL || 'https://bhasahub.onrender.com' }}
        run: |
          if [ -z "$PUSH_CRON_SECRET" ]; then echo "PUSH_CRON_SECRET is not set; skipping."; exit 0; fi
          # A sleeping free-tier server can take about a minute to wake up.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST -H "Authorization: Bearer $PUSH_CRON_SECRET" "$API_URL/api/push/run"
