<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=xiao-logo-2" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=xiao-logo-2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Xiao Ao — Chinese Made Simple. Learn with English explanations, structured lessons, native audio, and interactive practice tools."
    />
    <meta name="theme-color" content="#de2910" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/icon-180.png?v=xiao-logo-2" />
    <meta name="apple-mobile-web-app-title" content="Xiao Ao" />
    <title>Xiao Ao · Chinese Made Simple</title>

    <!-- Load fonts here (faster than CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script type="module">
      // In local dev the Vite dev server (5173) and the API (5001) run on
      // different ports. In production the client (Vercel) and API (Render)
      // are separate origins, so VITE_API_BASE_URL (set at build time in
      // Vercel's project settings) must point at the deployed API. Falling
      // back to '' covers the case where a single server serves both.
      // Matching on the Vite dev port (rather than hostname === 'localhost')
      // means the dev fallback also works when the page is loaded via a LAN
      // IP, e.g. from a phone on the same Wi-Fi.
      window.API_BASE_URL =
        import.meta.env.VITE_API_BASE_URL ??
        (window.location.port === '5173'
          ? `http://${window.location.hostname}:5001`
          : '');
    </script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client?hl=en" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
