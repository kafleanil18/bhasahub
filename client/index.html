<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=xiao-logo-2" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=xiao-logo-2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Xiao Ao — Chinese Made Simple. Learn with English explanations, structured lessons, native audio, and interactive practice tools."
    />
    <meta name="theme-color" content="#de2910" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/icon-180.png?v=xiao-logo-2" />
    <meta name="apple-mobile-web-app-title" content="Xiao Ao" />
    <title>Xiao Ao · Chinese Made Simple</title>

    <!-- Load fonts here (faster than CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Brush fonts for the loading screen, subset to just the letters it uses (a few KB). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Ma+Shan+Zheng&display=swap&text=Loading%E5%8A%A0%E8%BD%BD%E4%B8%AD"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so the loader matches it.
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <style>
      /* Ink loading screen. Shared by this first-paint copy and src/components/InkLoader.jsx. */
      .ink-loader { --ink-color: #1b1714; display: grid; place-items: center; align-content: center; gap: 6px; min-height: 48vh; padding: 32px 16px; color: var(--ink-color); opacity: 0; animation: ink-appear .35s ease .12s forwards; }
      .ink-loader.is-fullscreen { position: fixed; inset: 0; z-index: 2000; min-height: 0; background: #faf6ec; }
      .dark .ink-loader { --ink-color: #efe7d8; }
      .dark .ink-loader.is-fullscreen { background: #1a1714; }
      .ink-loader-mark { width: 92px; height: 92px; overflow: visible; animation: ink-turn 7.8s linear infinite; }
      .ink-loader-mark path, .ink-loader-mark circle { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: ink-brush 2.6s cubic-bezier(.55,.06,.3,1) infinite; }
      .ink-loader-mark .ink-drop { stroke: none; fill: currentColor; stroke-dasharray: none; animation: ink-drop 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .ink-loader-words { display: grid; justify-items: center; line-height: 1; animation: ink-write 2.6s cubic-bezier(.55,.06,.3,1) infinite; }
      .ink-loader-en { font: 400 34px/1.1 'Great Vibes', 'Brush Script MT', cursive; letter-spacing: .01em; }
      .ink-loader-zh { margin-top: 2px; font: 400 21px/1.2 'Ma Shan Zheng', 'Noto Serif SC', serif; letter-spacing: .28em; padding-left: .28em; opacity: .82; }
      .ink-loader-message { margin: 10px 0 0; color: var(--ink-color); opacity: .62; font: 500 14px/1.4 'Inter', system-ui, sans-serif; letter-spacing: .01em; text-align: center; }
      @keyframes ink-appear { to { opacity: 1; } }
      @keyframes ink-turn { to { transform: rotate(360deg); } }
      @keyframes ink-brush { 0% { stroke-dashoffset: 1; opacity: 1; } 55% { stroke-dashoffset: 0; opacity: 1; } 80% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes ink-drop { 0% { transform: scale(0); opacity: 0; } 8% { transform: scale(1.25); opacity: 1; } 16%, 80% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
      @keyframes ink-write { 0% { clip-path: inset(0 100% 0 0); opacity: 1; } 10% { clip-path: inset(0 100% 0 0); } 60%, 80% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(0 0 0 0); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .ink-loader-mark, .ink-loader-mark .ink-drop { animation: none; }
        .ink-loader-mark path, .ink-loader-mark circle { stroke-dashoffset: 0; animation: none; }
        .ink-loader-words { animation: ink-pulse 1.8s ease-in-out infinite alternate; }
        @keyframes ink-pulse { from { opacity: 1; } to { opacity: .45; } }
      }
    </style>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script type="module">
      // In local dev the Vite dev server (5173) and the API (5001) run on
      // different ports. In production the client (Vercel) and API (Render)
      // are separate origins, so VITE_API_BASE_URL (set at build time in
      // Vercel's project settings) must point at the deployed API. Falling
      // back to '' covers the case where a single server serves both.
      // Matching on the Vite dev port (rather than hostname === 'localhost')
      // means the dev fallback also works when the page is loaded via a LAN
      // IP, e.g. from a phone on the same Wi-Fi.
      window.API_BASE_URL =
        import.meta.env.VITE_API_BASE_URL ??
        (window.location.port === '5173'
          ? `http://${window.location.hostname}:5001`
          : '');
    </script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client?hl=en" async defer></script>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app starts; React replaces it. Same markup as InkLoader.jsx. -->
      <div class="ink-loader is-fullscreen" role="status" aria-label="Loading">
        <svg class="ink-loader-mark" viewBox="0 0 120 120" aria-hidden="true">
          <defs><filter id="ink-rough-boot" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter></defs>
          <g filter="url(#ink-rough-boot)" fill="none" stroke="currentColor">
            <path pathLength="1" stroke-width="8.5" stroke-linecap="round" d="M67.3 18.6A42 42 0 1 1 45.6 20.5"/>
            <path pathLength="1" stroke-width="2.2" opacity=".5" d="M67.8 14.7A45.8 45.8 0 1 1 44.3 16.9"/>
            <path pathLength="1" stroke-width="1.8" opacity=".4" d="M66.6 22.4A38.2 38.2 0 1 1 46.9 24.1"/>
            <circle class="ink-drop" cx="67.3" cy="18.6" r="5.6"/>
          </g>
        </svg>
        <div class="ink-loader-words" aria-hidden="true"><span class="ink-loader-en">Loading</span><span class="ink-loader-zh">加载中</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
