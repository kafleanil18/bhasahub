<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23c2402a'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23faf7f0' font-family='serif'%3E语%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BhashaHub — learn Chinese and Nepali with structured lessons, native audio, and real progress tracking."
    />
    <meta name="theme-color" content="#faf7f0" />
    <title>BhashaHub · Learn Chinese & Nepali</title>

    <!-- Load fonts here (faster than CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;700&family=Noto+Serif+Devanagari:wght@500&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script type="module">
      // In local dev the Vite dev server (5173) and the API (5001) run on
      // different ports. In production the client (Vercel) and API (Render)
      // are separate origins, so VITE_API_BASE_URL (set at build time in
      // Vercel's project settings) must point at the deployed API. Falling
      // back to '' covers the case where a single server serves both.
      // Matching on the Vite dev port (rather than hostname === 'localhost')
      // means the dev fallback also works when the page is loaded via a LAN
      // IP, e.g. from a phone on the same Wi-Fi.
      window.API_BASE_URL =
        import.meta.env.VITE_API_BASE_URL ??
        (window.location.port === '5173'
          ? `http://${window.location.hostname}:5001`
          : '');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
